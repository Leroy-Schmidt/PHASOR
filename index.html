<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHASOR</title>
<style>
  :root { --accent: #e8a33d; --bg: #0e1013; --panel: #14161a; --text: #cfd3d8; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, sans-serif;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    grid-template-rows: minmax(0, 1fr) 64px;
    grid-template-areas: "view slices" "scrub scrub";
    gap: 8px; padding: 8px;
  }
  @media (max-width: 900px) {
    body {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: minmax(0, 2fr) minmax(0, 1fr) 64px;
      grid-template-areas: "view" "slices" "scrub";
    }
  }
  #view { grid-area: view; background: var(--panel); border-radius: 6px; overflow: hidden; position: relative;
    user-select: none; -webkit-user-select: none; }
  /* stop the browser from starting a native drag / text-select on the canvas
     mid-rotate (shows the not-allowed cursor and stalls OrbitControls) */
  #view canvas { touch-action: none; -webkit-user-drag: none; display: block; }
  #slices { grid-area: slices; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  #slices details { background: var(--panel); border-radius: 6px; min-height: 0;
    display: flex; flex-direction: column; overflow: hidden; }
  #slices details[open] { flex: 1 1 0; }          /* open panels share the column */
  #slices details:not([open]) { flex: 0 0 auto; }  /* folded panels shrink to the title */
  #slices summary { cursor: pointer; padding: 8px 10px; color: var(--text); font-size: 12px;
    user-select: none; list-style: none; }
  #slices summary::-webkit-details-marker { display: none; }
  #slices summary::before { content: '▾ '; color: var(--accent); }
  #slices details:not([open]) summary::before { content: '▸ '; }
  #slices .panel-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
    gap: 6px; padding: 0 10px 10px; }
  #readouts-wrap { background: var(--panel); border-radius: 6px; padding: 10px; }
  .slice-header { color: #8a919a; font-size: 12px; }
  .slice-canvas { flex: 1 1 auto; min-height: 120px; width: 100%; }
  .slice-bar-row { display: flex; gap: 8px; align-items: center; }
  .slice-bar { flex: 1 1 auto; height: 10px; border-radius: 3px; }
  .slice-bar-label { font-size: 11px; color: #8a919a; min-width: 52px;
    font-variant-numeric: tabular-nums; }
  .slice-note { font-size: 11px; color: var(--accent); min-height: 14px; }
  #readouts { font-size: 12px; line-height: 1.6; font-variant-numeric: tabular-nums; }
  #readouts .bad { color: #e0533d; font-weight: 600; }
  #readouts .ok { color: #7dba6a; }
  #scrub { grid-area: scrub; background: var(--panel); border-radius: 6px;
    display: flex; align-items: center; padding: 0 16px; color: #8a919a; gap: 14px; }
  #scrub label { font-size: 12px; color: #8a919a; white-space: nowrap; }
  #scrub button { background: #20242b; color: var(--text); border: 1px solid #2d323b;
    border-radius: 4px; padding: 5px 12px; cursor: pointer; font: inherit; }
  #scrub button:hover { border-color: var(--accent); }
  #scrub input[type=range] { flex: 1 1 auto; accent-color: var(--accent); }
  #scrub-time { min-width: 96px; text-align: right; color: var(--accent);
    font-variant-numeric: tabular-nums; }
  #status { position: absolute; left: 10px; bottom: 8px; color: var(--accent);
    font-variant-numeric: tabular-nums; pointer-events: none; }
  .export-btn { background: #20242b; color: var(--text); border: 1px solid #2d323b;
    border-radius: 4px; font: 11px system-ui, sans-serif; padding: 2px 7px;
    cursor: pointer; }
  .export-btn:hover { border-color: var(--accent); }
  #slices summary .export-actions { float: right; display: inline-flex; gap: 6px; }
  #view .export-actions { position: absolute; right: 10px; top: 10px;
    display: flex; gap: 6px; z-index: 2; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/dist/lil-gui.esm.min.js"
  }
}
</script>
</head>
<body>
  <div id="view"><div id="status"></div></div>
  <div id="slices"></div>
  <div id="scrub">
    <button id="scrub-play" title="Play / pause time">▶</button>
    <button id="scrub-mode" title="Toggle day / year sweep">Day</button>
    <label>time</label>
    <input id="scrub-range" type="range" min="0" max="1" step="0.001" value="0">
    <span id="scrub-time">00:00</span>
  </div>

<script type="module">
import { buildGrid, paintBoxes, cellIndex } from './src/grid.mjs';
import { MATERIALS, presets, layersWithInsulation } from './src/model.mjs';
import { Viz3D } from './src/viz3d.mjs';
import { SlicePanel } from './src/viz2d.mjs';
import { LineProbe } from './src/lineprobe.mjs';
import { LossView } from './src/lossview.mjs';
import { buildUI, FIELD_MODES } from './src/ui.mjs';
import { OMEGA_ANNUAL, OMEGA_DIURNAL } from './src/physics.mjs';
import { advanceFraction } from './src/scrub.mjs';

const OMEGA = { annual: OMEGA_ANNUAL, diurnal: OMEGA_DIURNAL };

const viz = new Viz3D(document.getElementById('view'));
const status = document.getElementById('status');
const slicesEl = document.getElementById('slices');
slicesEl.textContent = '';

// Collapsible panels so they don't crowd each other: fold one away to give the
// other the column. A <details> 'toggle' re-renders so the canvas resizes.
function makeSection(title, open) {
  const d = document.createElement('details');
  d.open = open;
  const summary = document.createElement('summary');
  summary.textContent = title;
  const actions = document.createElement('span'); // export buttons live here
  actions.className = 'export-actions';
  summary.appendChild(actions);
  const body = document.createElement('div');
  body.className = 'panel-body';
  d.append(summary, body);
  slicesEl.appendChild(d);
  return { details: d, body, actions };
}

// --- export (M4): PNG of any panel, CSV of the line probe. Tiny download helper.
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportCanvasPNG(canvas, filename) {
  canvas.toBlob((b) => { if (b) downloadBlob(b, filename); }, 'image/png');
}
function exportText(text, filename, mime = 'text/csv') {
  downloadBlob(new Blob([text], { type: mime }), filename);
}
function addExportBtn(parent, label, title, onClick) {
  const b = document.createElement('button');
  b.className = 'export-btn';
  b.textContent = label;
  b.title = title;
  b.addEventListener('click', (e) => { e.stopPropagation(); e.preventDefault(); onClick(); });
  parent.appendChild(b);
  return b;
}
const stamp = () => current?.name ?? 'phasor';

const mapSec = makeSection('Field map (slice)', true);
const probeSec = makeSection('Line probe (profile)', true);
const lossSec = makeSection('Annual heat loss', false);
const slices = new SlicePanel(mapSec.body);
const probe = new LineProbe(probeSec.body);
const loss = new LossView(lossSec.body);
mapSec.details.addEventListener('toggle', () => slices.requestRender());
probeSec.details.addEventListener('toggle', () => probe.requestRender());
lossSec.details.addEventListener('toggle', () => loss.requestRender());

// M4 headline: paint the panel's field onto the 3D model. The panel is the
// single source of the displayed field; every change (mode, freq, scrub tick)
// emits here and the in-scene slice plane mirrors it — the field breathes on
// the 3D model with no second physics path and no re-solve.
let currentModel = null;
slices.onFieldUpdate = (f) => {
  if (currentModel) viz.setFieldSlice(currentModel, f.T, f.range, f.cm, f.frac);
};

// export buttons: PNG on each panel + the 3D view, CSV on the line probe
addExportBtn(mapSec.actions, '⤓ PNG', 'Download the slice map as PNG',
  () => exportCanvasPNG(slices.canvas, `${stamp()}-slice.png`));
addExportBtn(probeSec.actions, '⤓ PNG', 'Download the line profile as PNG',
  () => exportCanvasPNG(probe.canvas, `${stamp()}-profile.png`));
addExportBtn(lossSec.actions, '⤓ PNG', 'Download the heat-loss curve as PNG',
  () => exportCanvasPNG(loss.canvas, `${stamp()}-heatloss.png`));
addExportBtn(probeSec.actions, '⤓ CSV', 'Download the line-probe data as CSV', () => {
  const csv = probe.toCSV();
  if (csv) exportText(csv, `${stamp()}-lineprobe.csv`);
  else status.textContent = 'Line probe — solve first, then export CSV';
});
const viewActions = document.createElement('div');
viewActions.className = 'export-actions';
document.getElementById('view').appendChild(viewActions);
addExportBtn(viewActions, '⤓ PNG', 'Download the 3D view as PNG',
  () => { viz.render(); exportCanvasPNG(viz.renderer.domElement, `${stamp()}-3d.png`); });

const readoutsWrap = document.createElement('div');
readoutsWrap.id = 'readouts-wrap';
const readouts = document.createElement('div');
readouts.id = 'readouts';
readoutsWrap.appendChild(readouts);
slicesEl.appendChild(readoutsWrap);

// --- time scrubber (signature instrument): sweeps a day or a year while the
// field breathes. Pure phasor evaluation in the panel — never a re-solve.
const scrubMode = { unit: 'day' };
const scrubRange = document.getElementById('scrub-range');
const scrubTime = document.getElementById('scrub-time');
const scrubModeBtn = document.getElementById('scrub-mode');

function applyScrub() {
  const frac = parseFloat(scrubRange.value);
  const day = scrubMode.unit === 'day';
  const period = day ? 86400 : 31557600;
  slices.setTime(frac * period);
  probe.setTime(frac * period);
  loss.setTime(frac * period);
  if (day) {
    const h = frac * 24;
    const hh = Math.floor(h);
    const mm = Math.round((h - hh) * 60);
    scrubTime.textContent = `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
  } else {
    scrubTime.textContent = `day ${Math.round(frac * 365.25)}`;
  }
}
scrubRange.addEventListener('input', applyScrub);
scrubModeBtn.addEventListener('click', () => {
  scrubMode.unit = scrubMode.unit === 'day' ? 'year' : 'day';
  scrubModeBtn.textContent = scrubMode.unit === 'day' ? 'Day' : 'Year';
  applyScrub();
});

// --- play/pause: animate the scrubber hands-free over the solve-free phasor
// path (BACKLOG QoL). A rAF loop advances the scrub fraction; one full sweep
// takes SWEEP_SECONDS. Stops on pause and when the user grabs the scrubber.
const SWEEP_SECONDS = 12;
const playBtn = document.getElementById('scrub-play');
let playing = false;
let rafId = null;
let lastTs = 0;
function playTick(ts) {
  if (!playing) return;
  const dt = lastTs ? (ts - lastTs) / 1000 : 0;
  lastTs = ts;
  scrubRange.value = String(advanceFraction(parseFloat(scrubRange.value), dt, 1 / SWEEP_SECONDS));
  applyScrub(); // programmatic .value change doesn't fire 'input' — call directly
  rafId = requestAnimationFrame(playTick);
}
function setPlaying(on) {
  if (on === playing) return;
  playing = on;
  playBtn.textContent = on ? '⏸' : '▶';
  if (on) { lastTs = 0; rafId = requestAnimationFrame(playTick); }
  else if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
}
playBtn.addEventListener('click', () => setPlaying(!playing));
// a real user drag fires 'input' (programmatic sets above don't) → interrupt play
scrubRange.addEventListener('input', () => setPlaying(false));

let current = null; // { name, params }
let seq = 0;        // solve sequence — bumping it invalidates in-flight results

// Does the painted geometry change along z? (If not, the slice-z control is a
// no-op and gets hidden.) True only when some column differs across z layers.
function geometryVariesInZ(grid, painted) {
  if (grid.nz < 2) return false;
  for (let j = 0; j < grid.ny; j++) {
    for (let i = 0; i < grid.nx; i++) {
      const c0 = painted.cells[cellIndex(grid, i, j, 0)];
      for (let k = 1; k < grid.nz; k++) {
        if (painted.cells[cellIndex(grid, i, j, k)] !== c0) return true;
      }
    }
  }
  return false;
}

function loadPreset(name, params = {}) {
  const preset = presets[name](params);
  const grid = buildGrid(preset.gridSpec);
  const painted = paintBoxes(grid, preset.boxes, preset.background);
  // quarter-symmetry presets (basement3d) mirror the solved quadrant out to the
  // full model for display; others render as-is. Set before showModel builds it.
  viz.setSymmetry(preset.symmetry);
  viz.showModel(grid, painted, MATERIALS, preset.background, preset.extent);
  const m = { grid, painted, materials: MATERIALS };
  currentModel = m;
  slices.setModel(m);
  probe.setModel(m);
  // hide controls that don't apply: insulation (per preset) and slice-z (only
  // useful when the geometry actually varies along z — none of the current
  // presets do, so it stays hidden rather than reading as a dead control).
  ui.refreshControls(name, geometryVariesInZ(grid, painted));
  current = { name, params };
  status.textContent =
    `${name} — ${grid.nx}×${grid.ny}×${grid.nz} = ${grid.nx * grid.ny * grid.nz} cells`;
}

const worker = new Worker('./src/worker.mjs', { type: 'module' });

function solve() {
  const id = ++seq;
  readouts.innerHTML = '';
  status.textContent = 'solving…';
  worker.postMessage({ id, presetName: current.name, params: current.params, tol: 1e-10 });
}

function invalidate(message) {
  seq++; // any in-flight result is now stale
  slices.clearField(message);
  probe.clear();
  loss.clear();
  readouts.innerHTML = '';
}

worker.onmessage = (e) => {
  const m = e.data;
  if (m.id !== seq) return; // stale result for an old geometry
  if (m.type === 'progress') {
    status.textContent = m.phase
      ? `solving ${m.phase} harmonic…`
      : `CG iteration ${m.iter} — rel. residual ${m.relRes.toExponential(1)}`;
  } else if (m.type === 'error') {
    status.textContent = `Solver error: ${m.message} — refine the grid or report this`;
  } else if (m.type === 'result') {
    const harmonics = (m.harmonics ?? []).map((h) => ({
      f: h.f, omega: h.omega, re: new Float64Array(h.re), im: new Float64Array(h.im),
      refRe: h.refRe, refIm: h.refIm, // outdoor forcing phasor → phase-lag reference
    }));
    const mean = new Float64Array(m.T);
    slices.setSolution({ mean, harmonics });
    slices.setMode(FIELD_MODES[ui.field]);
    slices.setFreq(OMEGA[ui.freq]);
    probe.setSolution({ mean, harmonics });
    probe.setFreq(OMEGA[ui.freq]);
    loss.setLoss(m.loss);
    applyScrub();
    renderReadouts(m.readouts);
    const hi = m.harmonics.map((h) => `${h.f} ${h.iterations} it`).join(', ');
    status.textContent = `solved — ${m.stats.cells} cells, mean CG ${m.stats.iterations} it; ` +
      `COCG ${hi}`;
  }
};
worker.onerror = (e) => {
  status.textContent = `Worker failed: ${e.message ?? 'see console'}`;
};

function fmt(v, digits = 3) {
  return Number.isFinite(v) ? v.toFixed(digits) : '—';
}

function renderReadouts(r) {
  const fLine = r.fRsi == null
    ? 'f_Rsi — n/a for this preset (no interior surface)'
    : (() => {
      const mold = r.fRsi < 0.70;
      return `f_Rsi (R_si = ${r.RsiUsed} m²K/W) = ` +
        `<span class="${mold ? 'bad' : 'ok'}">${fmt(r.fRsi, 3)}</span> ` +
        (mold ? '✗ &lt; 0.70 — mold risk' : '✓ ≥ 0.70') +
        ` · θ_si,min = ${fmt(r.thetaSiMin25, 2)} °C`;
    })();
  const psiLine = r.psi
    ? `ψ = ${fmt(r.psi.psi, 4)} W/(m·K) — external dimensions · ` +
      `U = ${fmt(r.U, 3)} W/(m²K) · L₂D = ${fmt(r.L2D, 4)} W/(m·K)`
    : 'ψ — only for extruded junction presets (corner2d, slab_junction)';
  const phiLine = `Φ_exterior = ${fmt(Math.abs(r.phi.exterior ?? NaN), 3)} W ` +
    `(${fmt(r.Ti, 0)} °C inside / ${fmt(r.Te, 0)} °C outside)`;
  readouts.innerHTML = `${fLine}<br>${psiLine}<br>${phiLine}`;
}

const ui = buildUI(Object.keys(presets), {
  onPreset: (name) => {
    loadPreset(name, { layers: layersWithInsulation(ui.insulation) });
    viz.setClip(ui.clipAxis, ui.clipPosition);
    invalidate('');
    solve();
  },
  onClip: (axis, frac) => viz.setClip(axis, frac),
  onInsulation: (t) => {
    // live geometry preview while dragging ("look before you solve"); the solve
    // fires once on release via onInsulationCommit — no solve flood, no freeze.
    loadPreset(current.name, { layers: layersWithInsulation(t) });
    viz.setClip(ui.clipAxis, ui.clipPosition);
    invalidate('updating…');
  },
  onInsulationCommit: () => solve(),
  onSlice: (frac) => slices.setSlice(frac),
  onField: (mode) => slices.setMode(mode),
  onFreq: (f) => { slices.setFreq(OMEGA[f]); probe.setFreq(OMEGA[f]); },
  onFreqToggle: (f, on) => slices.setEnabled(f, on),
  onGlyphs: (on) => slices.setGlyphs(on),
});
slices.setGlyphs(ui.arrows);

loadPreset(ui.preset, { layers: layersWithInsulation(ui.insulation) });
slices.setSlice(ui.sliceZ);
solve();
window.__phasor = { viz, slices, probe, loss, loadPreset, solve, ui }; // debug handle (console / tests)
</script>
</body>
</html>
